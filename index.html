<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Time Clock</title>
<link rel="manifest" href="manifest.json" id="mlink">
<script>if (/[?&]admin\b/.test(location.search) || location.hash === '#admin') document.getElementById('mlink').href = 'manifest-admin.json';</script>
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Clock">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 2W Diesel look: near-black, charcoal panels, safety orange */
  :root {
    --bg: #0a0a0b; --card: #121214; --card2: #1c1c1f; --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.18);
    --text: #f6f5f3; --muted: #9a9a98; --accent: #f4621f; --accent-h: #ff7d33; --accent-soft: rgba(244,98,31,.14);
    --green: #22c55e; --green-d: #15803d; --red: #ef4444; --red-d: #b91c1c; --amber: #f59e0b;
    --r: 6px;
    --head: "Oswald", system-ui, sans-serif; --body: "Barlow", system-ui, sans-serif; --mono: "Space Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh;
    background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 26px 26px; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 16px 48px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  input, select { font: inherit; }
  h2 { font-family: var(--head); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { height: 46px; width: auto; flex: none; }
  .brand img.round { height: 52px; width: 52px; border-radius: 50%; object-fit: cover; }
  .eyebrow { font: 700 11px var(--mono); color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
  .who { font: 600 24px/1.1 var(--head); text-transform: uppercase; color: var(--text); letter-spacing: .3px; }
  .who .acc { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .center { text-align: center; }
  .lbl, label.lbl { display: block; font: 700 11px var(--mono); color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin: 0 0 6px 2px; }

  .banner { display: flex; gap: 12px; align-items: center; border-radius: var(--r); padding: 12px 14px;
    margin-bottom: 14px; background: var(--card); border: 1px solid var(--line2); }
  .banner.warn { background: var(--accent-soft); border-color: rgba(244,98,31,.45); }
  .banner .grow > b { display: block; font-family: var(--head); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
  .btn { background: var(--card2); border: 1px solid var(--line2); border-radius: var(--r); padding: 12px 16px;
    font: 700 14px var(--head); text-transform: uppercase; letter-spacing: .6px; }
  .btn.sm { padding: 8px 12px; font-size: 13px; }
  .btn.blue, .btn.green { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.blue:active, .btn.green:active { background: var(--accent-h); }
  .btn.red { background: var(--red-d); border-color: var(--red-d); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .5; }

  .clock { text-align: center; padding: 24px 16px 20px; }
  .bigbtn { width: 210px; height: 210px; border-radius: 50%; font: 700 30px var(--head); text-transform: uppercase;
    letter-spacing: 1px; display: inline-flex; flex-direction: column; align-items: center;
    justify-content: center; box-shadow: 0 10px 34px rgba(0,0,0,.5); transition: transform .08s; }
  .bigbtn:active { transform: scale(.96); }
  .bigbtn.in { background: radial-gradient(circle at 30% 25%, var(--accent-h), #c94a10); color: #fff; box-shadow: 0 10px 40px rgba(244,98,31,.35); }
  .bigbtn.out { background: radial-gradient(circle at 30% 25%, #ffffff, #d8d6d2); color: #16140f; }
  .bigbtn small { font: 400 12px var(--mono); opacity: .85; margin-top: 6px; letter-spacing: .5px; text-transform: none; }
  .status { margin-top: 14px; font-size: 15px; }
  .status b { font: 600 22px var(--head); color: var(--accent); }

  .weekhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .arrow { width: 40px; height: 40px; border-radius: var(--r); background: var(--card2); border: 1px solid var(--line2); font-size: 20px; }
  .arrow:disabled { opacity: .3; }
  .wtitle { text-align: center; }
  .wtitle b { display: block; font: 600 18px var(--head); text-transform: uppercase; letter-spacing: .3px; }
  .wtitle span { font-family: var(--mono); font-size: 12px; }
  .total { text-align: center; margin: 10px 0 6px; }
  .total .num { font: 700 46px/1 var(--head); letter-spacing: 0; }
  .total .unit { color: var(--muted); font: 400 14px var(--mono); margin-left: 6px; }
  .day { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent;
    padding: 12px 4px; border-top: 1px solid var(--line); }
  .day .dname { width: 82px; font: 600 16px var(--head); text-transform: uppercase; }
  .day .dname span { display: block; font: 400 11px var(--mono); color: var(--muted); text-transform: none; }
  .day .chips { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--muted); }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--text); white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  .chip.open { background: var(--accent-soft); border-color: rgba(244,98,31,.5); color: var(--accent-h); }
  .day .dt { font: 600 17px var(--head); min-width: 48px; text-align: right; }
  .day.today .dname { color: var(--accent); }
  .day .chev { color: var(--muted); }
  .day.locked .chev { visibility: hidden; }
  .submitted { color: var(--green); font-weight: 600; }

  .pill { display: inline-block; font: 700 10px var(--mono); padding: 3px 8px; border-radius: 3px; letter-spacing: .8px; text-transform: uppercase; }
  .pill.ok { background: rgba(34,197,94,.14); color: #86efac; }
  .pill.no { background: var(--accent-soft); color: var(--accent-h); }
  .pill.on { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line2); }
  .pill.off { background: var(--card2); color: var(--muted); }

  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 10px 6px; border-radius: 4px; background: transparent; font: 600 14px var(--head);
    text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .shopbar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
  .shopbar button { flex: 1 0 auto; padding: 9px 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line2);
    font: 700 12px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .shopbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .emp { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; text-align: left;
    padding: 14px 4px; border-top: 1px solid var(--line); }
  .emp:first-child { border-top: 0; }
  .emp b { font: 600 17px var(--head); text-transform: uppercase; letter-spacing: .2px; }
  .emp .hrs { font: 700 20px var(--head); text-align: right; }
  .emp .hrs small { display: block; font: 700 10px var(--mono); color: var(--accent); }

  .field { display: block; width: 100%; background: var(--bg); border: 1px solid var(--line2); color: var(--text);
    border-radius: var(--r); padding: 13px 14px; font-size: 17px; }
  .field:focus { outline: 2px solid var(--accent); border-color: transparent; }
  select.field { -webkit-appearance: none; appearance: none; }

  /* Bottom sheet */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; z-index: 10; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; z-index: 11;
    background: var(--card); border-top: 2px solid var(--accent); border-radius: 10px 10px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .22s ease; max-width: 560px; margin: 0 auto; }
  #sheet:not(.open) { visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  #sheet.open { transform: none; }
  .sheethead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheethead h2 { margin: 0; font-size: 22px; }
  .x { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line2); font-size: 16px; }
  .entry { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .entry input[type=time] { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line2); color: var(--text);
    border-radius: var(--r); padding: 12px 8px; font: 18px var(--mono); text-align: center; -webkit-appearance: none; min-height: 50px; color-scheme: dark; }
  .entry .dash { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .del { width: 44px; height: 50px; border-radius: var(--r); background: #2a1410; border: 1px solid #5a2414; color: #fca5a5; font-size: 18px; }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(150%);
    background: var(--text); color: #16140f; padding: 12px 18px; border-radius: var(--r); font-weight: 700; z-index: 20; border-left: 4px solid var(--accent);
    transition: transform .2s, opacity .2s; opacity: 0; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #fee2e2; color: #7f1d1d; border-left-color: var(--red); }
  .spin { text-align: center; padding: 80px 0; color: var(--muted); font-family: var(--mono); }
  .code { font-family: var(--mono); letter-spacing: .5px; }
  .crew { padding: 14px 0; border-top: 1px solid var(--line); }
  .crew:first-child { border-top: 0; }
  .crew b { font: 600 17px var(--head); text-transform: uppercase; letter-spacing: .2px; }
  .crew .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .contact { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-bottom: 8px; color: inherit; text-decoration: none; font: inherit;
    background: var(--bg); border: 1px solid var(--line2); border-radius: var(--r); }
  .opt .ic { font-size: 22px; width: 30px; text-align: center; }
  .opt b { display: block; font: 600 16px var(--head); text-transform: uppercase; }
  .opt:disabled { opacity: .45; }
.linkbtn{background:none;border:0;color:var(--accent,#f4621f);font:inherit;font-size:14px;text-decoration:underline;margin-top:10px;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div id="app"><div class="spin">Loading…</div></div>
<div id="shade"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
'use strict';
const C = window.TC_CONFIG || {};
const app = document.getElementById('app');

// ---------- small helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const weekStartOf = (s) => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const fmtDay = (s) => parseYmd(s).toLocaleDateString([], { weekday: 'short' });
const fmtShort = (s) => parseYmd(s).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtLong = (s) => parseYmd(s).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?AM/i, 'a').replace(/\s?PM/i, 'p');
const hhmm = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const minsOf = (p) => Math.max(0, ((p.clock_out ? new Date(p.clock_out) : new Date()) - new Date(p.clock_in)) / 60000);
const hrs = (m) => (m / 60).toFixed(2);
const hm = (m) => { const t = Math.round(m); return `${Math.floor(t / 60)}h ${pad(t % 60)}m`; };
const sumMins = (list) => list.reduce((a, p) => a + minsOf(p), 0);
const todayStr = () => ymd(new Date());
const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
  del: (k) => { try { localStorage.removeItem(k); } catch (_) {} },
};
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(navigator.userAgent);
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (S.data && !ADMIN) renderEmp(); if (ADMIN && S.me && S.tab === 'settings') renderAdmin(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (S.data && !ADMIN) renderEmp(); });
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, err ? 4200 : 2400);
}

async function rpc(fn, args) {
  const h = { 'Content-Type': 'application/json', apikey: C.SUPABASE_KEY };
  if (String(C.SUPABASE_KEY).split('.').length === 3) h.Authorization = 'Bearer ' + C.SUPABASE_KEY; // legacy anon key
  let r;
  try {
    r = await fetch(`${C.SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: h, body: JSON.stringify(args || {}) });
  } catch (e) { throw new Error('No connection. Check your signal and try again.'); }
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (_) {}
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || `Something went wrong (${r.status})`);
  return data;
}

// ---------- header with logo ----------
const LOGO = C.LOGO_URL || 'https://2wdieselrepair.com/user/themes/dieselworks/images/logo.png';
const CANYON_LOGO = 'https://canyonlakehydraulics.com/wp-content/uploads/2025/05/logo.png';
// Each shop shows its own logo (Canyon Lake gets its round badge).
const logoFor = (shop) => /canyon/i.test(shop || '') ? CANYON_LOGO : LOGO;
function headHTML(eyebrow, titleHTML, rightHTML, logo) {
  const src = logo || LOGO;
  return `<div class="top"><div class="brand"><img src="${esc(src)}" class="${src === CANYON_LOGO ? 'round' : ''}" alt="" onerror="this.remove()">
    <div class="grow"><div class="eyebrow">${esc(eyebrow)}</div><div class="who">${titleHTML}</div></div></div>${rightHTML || ''}</div>`;
}

// ---------- bottom sheet ----------
function openSheet(html) {
  const sh = document.getElementById('sheet');
  sh.innerHTML = html; document.getElementById('shade').style.display = 'block';
  requestAnimationFrame(() => sh.classList.add('open'));
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('shade').style.display = 'none';
}
document.getElementById('shade').onclick = closeSheet;

// ---------- startup ----------
const params = new URLSearchParams(location.search);
const ADMIN = params.has('admin') || location.hash === '#admin';
const S = { token: null, adminTok: ls.get('tc_admin'), me: null, data: null, ws: null, tab: 'hours', crew: [], logins: [], shops: null, shop: ls.get('tc_shop') };

if (params.get('k')) { S.token = params.get('k').trim().toLowerCase(); ls.set('tc_token', S.token); }
else S.token = ls.get('tc_token');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.title = C.SHOP_NAME || 'Shop Time Clock';

function start() {
  if (!C.SUPABASE_URL || /YOUR-PROJECT/.test(C.SUPABASE_URL) || /PASTE/.test(C.SUPABASE_KEY)) {
    app.innerHTML = `<div class="card"><h2>Almost there</h2><p class="muted">Open <b>config.js</b> and paste in your Supabase URL and key (Setup guide, step 2).</p></div>`;
    return;
  }
  if (ADMIN) return adminStart();
  if (!S.token) return codeScreen();
  const ws = location.hash === '#lastweek' ? addDays(weekStartOf(todayStr()), -7) : null;
  loadEmp(ws);
}

// =====================================================================
//  EMPLOYEE
// =====================================================================
function codeScreen(msg) {
  app.innerHTML = `
    ${headHTML(C.SHOP_NAME, 'Time <span class="acc">Clock</span>')}
    <div class="card">
      <h2 style="margin-top:0">Enter your code</h2>
      <p class="muted small">Open the link the office emailed you, or type the code from it here.</p>
      ${msg ? `<p style="color:var(--red)">${esc(msg)}</p>` : ''}
      <input id="code" class="field code" autocomplete="off" autocapitalize="off" placeholder="e.g. 3fa9c21b7e">
      <div style="height:12px"></div>
      <button class="btn blue block" id="go">Continue</button>
    </div>`;
  document.getElementById('go').onclick = () => {
    const v = document.getElementById('code').value.trim().toLowerCase();
    if (!v) return;
    S.token = v; ls.set('tc_token', v); loadEmp();
  };
}

async function loadEmp(ws) {
  try {
    S.data = await rpc('emp_week', { p_token: S.token, p_week_start: ws || S.ws || todayStr() });
    S.ws = S.data.week_start;
    renderEmp();
    refreshPushSilently();
  } catch (e) {
    if (/not valid/i.test(e.message)) { ls.del('tc_token'); S.token = null; return codeScreen(e.message); }
    if (!S.data) app.innerHTML = `<div class="card center"><p>${esc(e.message)}</p><button class="btn" onclick="loadEmp()">Try again</button></div>`;
    else toast(e.message, true);
  }
}

function canEdit(date) { return S.data && date >= S.data.editable_from && date <= addDays(S.data.today, 1); }

function bannersHTML() {
  const d = S.data, out = [];
  const dow = parseYmd(d.today).getDay(); // 0 Sun .. 6 Sat
  const lastWs = addDays(weekStartOf(d.today), -7);
  if (isIOS && !isStandalone()) {
    out.push(`<div class="banner"><div style="font-size:26px">📲</div><div class="grow"><b>Add this to your Home Screen</b>
      <span class="small muted">Tap the Share button <span style="font-size:15px">⬆︎</span> below, then <b>Add to Home Screen</b>. Open it from there to get reminders.</span></div></div>`);
  }
  if (isAndroid && !isStandalone()) {
    out.push(`<div class="banner"><div style="font-size:26px">📲</div><div class="grow"><b>Install the app</b>
      <span class="small muted">${installEvt ? 'Puts Time Clock on your home screen like a regular app.' : 'In Chrome, tap the ⋮ menu (top right), then <b>Add to Home screen</b> or <b>Install app</b>.'}</span></div>
      ${installEvt ? '<button class="btn sm blue" id="installbtn">Install</button>' : ''}</div>`);
  }
  if (isIOS && !isStandalone()) {
    // iPhone: reminders only work after Add to Home Screen (banner above)
  } else if ('PushManager' in window && (typeof Notification === 'undefined' || Notification.permission !== 'granted' || !ls.get('tc_push_ok'))) {
    const denied = typeof Notification !== 'undefined' && Notification.permission === 'denied';
    out.push(`<div class="banner"><div style="font-size:26px">🔔</div><div class="grow"><b>Turn on reminders</b>
      <span class="small muted">${denied ? (isAndroid ? 'Notifications are blocked. Tap the icon left of the web address (or long-press the app icon → App info) and allow Notifications.' : 'Notifications are blocked. Turn them on in your phone Settings for this app.') : 'Get a heads-up Monday and Thursday so you never miss payroll.'}</span></div>
      ${denied ? '' : '<button class="btn sm blue" id="pushbtn">Turn on</button>'}</div>`);
  }
  if (dow === 1 && S.ws !== lastWs) {
    out.push(`<div class="banner warn"><div style="font-size:26px">🗓️</div><div class="grow"><b>Monday check</b><span class="small">Review last week's hours and fill in anything missing.</span></div>
      <button class="btn sm" data-goweek="${lastWs}">Review</button></div>`);
  } else if ((dow === 4 || dow === 5) && !d.last_week_submitted && S.ws !== lastWs) {
    out.push(`<div class="banner warn"><div style="font-size:26px">⏰</div><div class="grow"><b>Time card due${dow === 4 ? ' today' : ''}</b><span class="small">Submit last week's hours for Friday payroll.</span></div>
      <button class="btn sm" data-goweek="${lastWs}">Open</button></div>`);
  }
  return out.join('');
}

function weekLabel(ws, today) {
  const cur = weekStartOf(today);
  if (ws === cur) return 'This week';
  if (ws === addDays(cur, -7)) return 'Last week';
  return 'Week of ' + fmtShort(ws);
}

function renderEmp() {
  const d = S.data, ws = S.ws, open = d.open_punch;
  const punches = d.punches;
  const total = sumMins(punches);
  const ot = Math.max(0, total - 2400);
  const weekEditable = addDays(ws, 6) >= d.editable_from;
  const isFuture = ws > weekStartOf(d.today);

  let days = '';
  for (let i = 0; i < 7; i++) {
    const date = addDays(ws, i);
    const list = punches.filter((p) => p.work_date === date);
    const chips = list.map((p) => `<span class="chip ${p.clock_out ? '' : 'open'}">${fmtTime(p.clock_in)}–${p.clock_out ? fmtTime(p.clock_out) : 'now'}</span>`).join('');
    const m = sumMins(list);
    days += `<button class="day ${date === d.today ? 'today' : ''} ${canEdit(date) ? '' : 'locked'}" data-day="${date}">
      <div class="dname">${fmtDay(date)}<span>${fmtShort(date)}</span></div>
      <div class="chips">${chips || (canEdit(date) && date <= d.today ? '<span>Tap to add</span>' : '')}</div>
      <div class="dt">${m ? hrs(m) : ''}</div><div class="chev">›</div></button>`;
  }

  let submit = '';
  if (d.submitted_at) {
    submit = `<p class="center submitted">✓ Submitted ${esc(fmtShort(ymd(new Date(d.submitted_at))))} at ${esc(fmtTime(d.submitted_at))}</p>
      ${weekEditable ? '<p class="center small muted">Changing a day will un-submit it so you can send it again.</p>' : ''}`;
  } else if (weekEditable && !isFuture) {
    submit = `<button class="btn green block" id="submitbtn" style="margin-top:8px">Submit week for payroll</button>`;
  } else if (!weekEditable) {
    submit = `<p class="center small muted">Not submitted · ask the office to change older weeks</p>`;
  }

  app.innerHTML = `
    ${headHTML(d.employee.shop || C.SHOP_NAME, `Hi, <span class="acc">${esc(d.employee.name.split(' ')[0])}</span>`, '', logoFor(d.employee.shop))}
    ${bannersHTML()}
    <div class="card clock">
      ${open
        ? `<button class="bigbtn out" id="clockbtn">CLOCK OUT<small>tap to end shift</small></button>
           <div class="status">On the clock since <b>${fmtTime(open.clock_in)}</b><br><span class="muted" id="elapsed">${hm(minsOf(open))}</span></div>`
        : `<button class="bigbtn in" id="clockbtn">CLOCK IN<small>tap to start</small></button>
           <div class="status muted">You're off the clock</div>
           <button class="linkbtn" id="latebtn">Forgot to clock in? Start from an earlier time</button>`}
    </div>
    <div class="card">
      <div class="weekhead">
        <button class="arrow" id="prev">‹</button>
        <div class="wtitle"><b>${weekLabel(ws, d.today)}</b><span class="small muted">${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}</span></div>
        <button class="arrow" id="next" ${ws >= weekStartOf(d.today) ? 'disabled' : ''}>›</button>
      </div>
      <div class="total"><span class="num">${hrs(total)}</span><span class="unit">hrs</span>
        ${ot ? `<div class="small" style="color:var(--amber)">includes ${hrs(ot)} overtime</div>` : ''}</div>
      ${days}
      ${submit}
    </div>
    ${(d.adjustments || []).length ? `<div class="card"><label class="lbl">Pay changes this week</label>${adjListHTML(d.adjustments, true)}</div>` : ''}
    <p class="center small muted">Forgot to clock in or out? Tap the day to type in your times.</p>`;

  app.querySelectorAll('[data-adjrm]').forEach((b) => b.onclick = async () => {
    if (!confirm('Remove this pay change request?')) return;
    try { await rpc('emp_remove_adjustment', { p_token: S.token, p_id: b.dataset.adjrm }); toast('Removed'); loadEmp(); }
    catch (e) { toast(e.message, true); }
  });

  document.getElementById('clockbtn').onclick = clockToggle;
  const lb = document.getElementById('latebtn'); if (lb) lb.onclick = openLateClockIn;
  document.getElementById('prev').onclick = () => loadEmp(addDays(ws, -7));
  document.getElementById('next').onclick = () => loadEmp(addDays(ws, 7));
  app.querySelectorAll('[data-day]').forEach((b) => b.onclick = () => {
    const date = b.dataset.day;
    if (!canEdit(date)) return toast(date > d.today ? "That day hasn't happened yet" : 'Locked. Ask the office to change it.');
    openDayEditor({
      date, name: null,
      punches: d.punches.filter((p) => p.work_date === date),
      save: (row) => rpc('emp_save_punch', { p_token: S.token, p_id: row.id, p_work_date: date, p_in: row.in, p_out: row.out, p_note: null }),
      del: (id) => rpc('emp_delete_punch', { p_token: S.token, p_id: id }),
      done: () => loadEmp(),

  app.querySelectorAll('[data-goweek]').forEach((b) => b.onclick = () => loadEmp(b.dataset.goweek));
  const pb = document.getElementById('pushbtn'); if (pb) pb.onclick = enablePush;

async function clockToggle() {
  const btn = document.getElementById('clockbtn'); btn.disabled = true;
  const wasOpen = !!S.data.open_punch;
  try {
    await rpc(wasOpen ? 'emp_clock_out' : 'emp_clock_in', { p_token: S.token });
    if (navigator.vibrate) navigator.vibrate(40);
    toast(wasOpen ? 'Clocked out ✓' : 'Clocked in ✓');
    await loadEmp(weekStartOf(todayStr()));
  } catch (e) { toast(e.message, true); btn.disabled = false; loadEmp(); }
}

// "Forgot to clock in?" — start the clock from an earlier time today.
function openLateClockIn() {
  const today = todayStr();
  const lastOut = (S.data.punches || []).filter((p) => p.work_date === today && p.clock_out)
    .map((p) => new Date(p.clock_out)).sort((a, b) => b - a)[0];
  const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  openSheet(`
    <div class="sheethead"><h2>Start the clock earlier</h2><button class="x" id="sx">✕</button></div>
    <p class="small muted" style="margin-top:0">Back from lunch (or started work) and forgot to tap Clock In? Pick the time you actually started.
      The clock runs from then until you tap Clock Out.${lastOut ? `<br>Your last clock-out today was <b>${esc(fmtTime(lastOut.toISOString()))}</b>.` : ''}</p>
    <label class="lbl">Started at (today)</label>
    <input id="latetime" class="field" type="time" value="${pad(now.getHours())}:${pad(now.getMinutes())}">
    <div style="height:16px"></div>
    <button class="btn green block" id="latego">Clock me in from this time</button>`);
  const sh = document.getElementById('sheet');
  sh.querySelector('#sx').onclick = closeSheet;
  sh.querySelector('#latego').onclick = async () => {
    const v = sh.querySelector('#latetime').value;
    if (!/^\d{2}:\d{2}$/.test(v)) return toast('Pick a time first.', true);
    const [h, m] = v.split(':').map(Number);
    const t = new Date(); t.setHours(h, m, 0, 0);
    if (t > new Date(Date.now() + 60000)) return toast("That time hasn't happened yet.", true);
    if (lastOut && t < lastOut) return toast(`Pick a time after your last clock-out (${fmtTime(lastOut.toISOString())}).`, true);
    const b = sh.querySelector('#latego'); b.disabled = true;
    try {
      await rpc('emp_clock_in_at', { p_token: S.token, p_in: t.toISOString() });
      closeSheet();
      if (navigator.vibrate) navigator.vibrate(40);
      toast(`Clocked in from ${fmtTime(t.toISOString())} ✓`);
      await loadEmp(weekStartOf(todayStr()));
    } catch (e) { toast(e.message, true); b.disabled = false; }
  };
}

// ---------- push notifications ----------
function b64ToBytes(b64) {
  const p = '='.repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return toast(isIOS ? 'Add to Home Screen first, then open it from there.' : "This browser can't do notifications.", true);
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Notifications were not allowed.', true);
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(C.VAPID_PUBLIC_KEY) });
    await rpc('emp_save_push', { p_token: S.token, p_sub: sub.toJSON() });
    ls.set('tc_push_ok', '1');
    toast('Reminders are on ✓');
    renderEmp();
  } catch (e) { toast('Could not turn on reminders: ' + e.message, true); }
}
let pushRefreshed = false;
async function refreshPushSilently() {
  if (pushRefreshed || typeof Notification === 'undefined' || Notification.permission !== 'granted' || !('serviceWorker' in navigator)) return;
  pushRefreshed = true;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(C.VAPID_PUBLIC_KEY) });
    await rpc('emp_save_push', { p_token: S.token, p_sub: sub.toJSON() });
    if (!ls.get('tc_push_ok')) { ls.set('tc_push_ok', '1'); renderEmp(); }
  } catch (_) {}
}

// =====================================================================
//  DAY EDITOR (shared by employee + admin)
// =====================================================================
function openDayEditor(cfg) {
  const rows = cfg.punches.map((p) => ({ id: p.id, start: hhmm(p.clock_in), end: p.clock_out ? hhmm(p.clock_out) : '', orig: p }));
  const removed = [];
  if (!rows.length) rows.push({ id: null, start: '08:00', end: '17:00' });

  const toIso = (date, t) => new Date(`${date}T${t}:00`).toISOString();
  function rowMins(r) {
    if (!r.start || !r.end) return 0;
    let a = new Date(`${cfg.date}T${r.start}:00`), b = new Date(`${cfg.date}T${r.end}:00`);
    if (b <= a) b = new Date(b.getTime() + 86400000);
    return (b - a) / 60000;
  }
  function draw() {
    const tot = rows.reduce((a, r) => a + rowMins(r), 0);
    openSheet(`
      <div class="sheethead"><div><h2>${esc(fmtLong(cfg.date))}</h2>${cfg.name ? `<div class="small muted">${esc(cfg.name)}</div>` : ''}</div><button class="x" id="sx">✕</button></div>
      <div class="hint">Start and end times. Took lunch? Use two lines (before lunch and after).</div>
      <div id="rows">${rows.map((r, i) => `
        <div class="entry">
          <input type="time" data-i="${i}" data-k="start" value="${r.start}">
          <span class="dash">to</span>
          <input type="time" data-i="${i}" data-k="end" value="${r.end}">
          <button class="del" data-del="${i}" aria-label="Remove">🗑</button>
        </div>`).join('')}</div>
      <button class="btn ghost block" id="addrow">＋ Add time</button>
      <div class="total" style="margin:16px 0"><span class="num" style="font-size:30px" id="daytot">${hrs(tot)}</span><span class="unit">hrs</span></div>
      <button class="btn green block" id="saveday">Save</button>`);
    const sh = document.getElementById('sheet');
    sh.querySelector('#sx').onclick = closeSheet;
    sh.querySelectorAll('input[type=time]').forEach((inp) => inp.oninput = () => {
      rows[inp.dataset.i][inp.dataset.k] = inp.value;
      document.getElementById('daytot').textContent = hrs(rows.reduce((a, r) => a + rowMins(r), 0));
    });
    sh.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => {
      const [r] = rows.splice(Number(b.dataset.del), 1); if (r.id) removed.push(r.id); draw();
    });
    sh.querySelector('#addrow').onclick = () => {
      const last = rows[rows.length - 1];
      let s = '08:00', e = '';
      if (last && last.end) { const [h, m] = last.end.split(':').map(Number); const t = h * 60 + m + 30; s = pad(Math.floor(t / 60) % 24) + ':' + pad(t % 60); }
      rows.push({ id: null, start: s, end: e }); draw();
    };
    sh.querySelector('#saveday').onclick = save;
  }
  async function save() {
    const btn = document.getElementById('saveday');
    for (const r of rows) {
      if (!r.start) return toast('Every line needs a start time.', true);
      if (!r.end && !(r.orig && !r.orig.clock_out)) return toast('Every line needs an end time.', true);
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      for (const id of removed) await cfg.del(id);
      for (const r of rows) {
        const inIso = toIso(cfg.date, r.start);
        let outIso = null;
        if (r.end) {
          outIso = toIso(cfg.date, r.end);
          if (new Date(outIso) <= new Date(inIso)) outIso = new Date(new Date(outIso).getTime() + 86400000).toISOString();
        }
        const o = r.orig;
        const changed = !o || new Date(o.clock_in).getTime() !== new Date(inIso).getTime() ||
          (o.clock_out ? new Date(o.clock_out).getTime() : null) !== (outIso ? new Date(outIso).getTime() : null);
        if (changed) await cfg.save({ id: r.id, in: inIso, out: outIso });
      }
      closeSheet(); toast('Saved ✓'); cfg.done();
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Save'; cfg.done(); }
  }
  draw();
}

function adminLogin(msg) {
  app.innerHTML = `
    ${headHTML(C.SHOP_NAME, 'Office <span class="acc">Sign In</span>')}
    <div class="card">
      <h2 style="margin-top:0">Office sign in</h2>

      <input id="un" class="field" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off">

    </div>`;
  const go = async () => {
    try {
      S.adminTok = await rpc('admin_login', { p_username: document.getElementById('un').value, p_password: document.getElementById('pw').value });
      ls.set('tc_admin', S.adminTok); S.me = null; S.shops = null; loadAdmin();

  document.getElementById('go').onclick = go;

}

async function adminCall(fn, args) {
  try { return await rpc(fn, Object.assign({ p_tok: S.adminTok }, args)); }
  catch (e) {
    if (/ADMIN_LOGIN_REQUIRED/.test(e.message)) { ls.del('tc_admin'); S.adminTok = null; S.me = null; S.shops = null; adminLogin('Please sign in again.'); throw new Error('_silent'); }
    throw e;
  }
}

async function loadAdmin(ws) {
  try {
    if (!S.me) S.me = await adminCall('admin_me', {});
    if (!S.shops) S.shops = await adminCall('admin_shops', {});
    if (!S.shops.some((x) => x.id === S.shop)) { S.shop = S.shops[0] ? S.shops[0].id : null; if (S.shop) ls.set('tc_shop', S.shop); }
    if (S.tab === 'crew') { S.crew = await adminCall('admin_employees', { p_shop: S.shop }); }
    else if (S.tab === 'settings') {
      S.me = await adminCall('admin_me', {});
      S.logins = S.me.is_owner ? await adminCall('admin_logins', {}) : [];
      S.shops = await adminCall('admin_shops', {});
    }
    else {
      if (S.tab === 'payroll' && !S.me.is_owner) S.tab = 'hours';
      S.data = await adminCall('admin_week', { p_week_start: ws || S.ws || todayStr(), p_shop: S.shop }); S.ws = S.data.week_start;
      if (S.tab === 'payroll') S.pay = await adminCall('admin_payroll', { p_week_start: S.ws, p_shop: S.shop });
    }
    renderAdmin();
  } catch (e) { if (e.message !== '_silent') toast(e.message, true); }
}

const shopName = (id) => ((S.shops || []).find((x) => x.id === id) || {}).name || '';

function empWeek(id) {
  const list = S.data.punches.filter((p) => p.employee_id === id);
  const total = sumMins(list);
  return { list, total, ot: Math.max(0, total - 2400), open: list.some((p) => !p.clock_out), submitted: S.data.submissions[id] };
}

      del: (pid) => adminCall('admin_delete_punch', { p_id: pid }),

function exportCSV() {
  const d = S.data, ws = S.ws, we = addDays(ws, 6), shop = shopName(S.shop);
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const dayHead = [...Array(7)].map((_, i) => `${fmtDay(addDays(ws, i))} ${addDays(ws, i)}`);
  const lines = [['Shop', 'Employee', 'Week Start', 'Week End', ...dayHead, 'Total Hours', 'Regular', 'Overtime', 'Submitted'].map(q).join(',')];
  for (const e of d.employees) {
    const w = empWeek(e.id);
    const per = [...Array(7)].map((_, i) => hrs(sumMins(w.list.filter((p) => p.work_date === addDays(ws, i)))));
    lines.push([shop, e.name, ws, we, ...per, hrs(w.total), hrs(Math.min(w.total, 2400)), hrs(w.ot),
      w.submitted ? new Date(w.submitted).toLocaleString() : 'No'].map(q).join(','));
  }
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `timecards_${(shop || 'shop').replace(/[^A-Za-z0-9]+/g, '-')}_${ws}_to_${we}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---------- payroll (owner logins only) ----------
const PAY_TYPES = { hourly: 'Hourly (W-2)', salary: 'Salary', c_hourly: '1099 – hourly', c_flat: '1099 – flat per week' };
const RATE_LABEL = { hourly: 'Hourly rate', salary: 'Salary per week', c_hourly: 'Hourly rate', c_flat: 'Flat amount per week' };
const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cents = (n) => Math.round((Number(n) || 0) * 100) / 100;

// Gross pay for one employee this week. Hours are the time-card hours rounded to 2 decimals (same as the Hours tab).
function payCalc(id, over) {
  const set = Object.assign({ pay_type: 'hourly', rate: 0, commission_type: 'none', commission_pct: 0 }, (S.pay.settings || {})[id], over && over.set);
  const wk = Object.assign({ sales: 0, commission_amt: 0, other_amt: 0, note: '' }, (S.pay.weeks || {})[id], over && over.wk);
  const w = empWeek(id);
  const adjs = (S.pay.adjustments || []).filter((a) => a.employee_id === id);
  const ok = adjs.filter((a) => a.status === 'approved'), sumK = (k) => cents(ok.filter((a) => a.kind === k).reduce((t, a) => t + Number(a.amount), 0));
  const hAdj = cents(sumK('hours_add') - sumK('hours_sub')), parts = sumK('parts'), reimb = sumK('parts_reimb'), adjMoney = cents(sumK('add') - sumK('deduct'));
  const pending = adjs.filter((a) => a.status === 'pending').length;
  const cardH = Number(hrs(w.total)), h = Math.max(0, cents(cardH + hAdj)), rate = Number(set.rate) || 0;
  let reg = 0, ot = 0, base = 0, otPay = 0;
  if (set.pay_type === 'hourly') { reg = Math.min(h, 40); ot = Math.max(0, cents(h - 40)); base = cents(reg * rate); otPay = cents(ot * rate * 1.5); }
  else if (set.pay_type === 'c_hourly') { reg = h; base = cents(h * rate); }
  else { reg = h; base = cents(rate); }
  const comm = set.commission_type === 'percent' ? cents((Number(wk.sales) || 0) * (Number(set.commission_pct) || 0) / 100)
    : set.commission_type === 'flat' ? cents(wk.commission_amt) : 0;
  const other = cents(wk.other_amt);
  return { set, wk, h, cardH, hAdj, parts, reimb, adjMoney, pending, adjs, reg, ot, base, otPay, comm, other,
    gross: cents(base + otPay + comm + other + adjMoney - parts + reimb), open: w.open, noRate: !(rate > 0) };
}

      c.adjMoney ? `adj ${money(c.adjMoney)}` : '', c.comm ? `comm ${money(c.comm)}` : '', c.other ? `other ${money(c.other)}` : ''].filter(Boolean).join(' · ');

  }).join('');
  return `

        <div class="wtitle"><b>Payroll · ${weekLabel(ws, d.today)}</b><span class="small muted">${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}, ${parseYmd(addDays(ws, 6)).getFullYear()} · paid Friday ${fmtShort(addDays(ws, 11))}</span></div>

      <div class="row" style="justify-content:space-between;align-items:baseline;margin:10px 2px 2px">
        <span class="small muted">Total gross · ${esc(shopName(S.shop))}</span><b style="font-size:24px">${money(total)}</b></div>
      ${missing ? `<p class="small" style="color:#ff7d33;margin:6px 2px 0">${missing} employee${missing === 1 ? ' has' : 's have'} no pay rate yet. Tap them to set it.</p>` : ''}
      ${open ? `<p class="small" style="color:#ff7d33;margin:6px 2px 0">${open} still on the clock. Their hours count up to right now.</p>` : ''}
      ${waiting ? `<p class="small" style="color:#ff7d33;margin:6px 2px 0">${waiting} pay change${waiting === 1 ? '' : 's'} waiting for approval. They don't count until approved. Tap the employee.</p>` : ''}
      <p class="small muted" style="margin:6px 2px 0">Gross pay only, before taxes and deductions. Tap an employee to set their pay or add commission and bonuses.</p>
    </div>
    <div class="card" style="padding-top:4px;padding-bottom:4px">${rows || '<p class="muted center">No employees at this shop yet. Add them on the Crew tab.</p>'}</div>
    <button class="btn block ghost" id="paycsv">⬇︎ Download payroll CSV</button>`;

      <input id="cpct" class="field" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="${Number(c0.set.commission_pct) || ''}" placeholder="e.g. 10"></div>
    <div style="height:16px"></div>
    <label class="lbl">This week (${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))})</label>

    <div id="cflatwrap"><label class="small muted">Commission $</label>
      <input id="wcomm" class="field" type="number" inputmode="decimal" step="0.01" value="${Number(c0.wk.commission_amt) || ''}" placeholder="0.00"><div style="height:8px"></div></div>
    <label class="small muted">Bonus / other $ (use a minus for a deduction)</label>

    ${c0.adjs.length ? `<div style="height:16px"></div><label class="lbl">Pay changes ${esc(e.name.split(' ')[0])} sent in</label>
      ${c0.adjs.map((a) => `<div class="row" style="align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)">
        <div class="grow"><b>${esc(ADJ_SHORT[a.kind])}</b> <span class="code">${adjAmt(a)}</span>
          ${a.note ? `<div class="small muted">${esc(a.note)}</div>` : ''}
          ${a.status !== 'pending' && a.decided_by ? `<div class="small muted">${a.status === 'approved' ? 'Approved' : 'Rejected'} by ${esc(a.decided_by)}</div>` : ''}</div>
        ${a.status === 'pending'
          ? `<button class="btn sm green" data-adjok="${a.id}">Approve</button><button class="btn sm ghost" data-adjno="${a.id}" style="margin-left:6px">Reject</button>`
          : `${ADJ_PILL[a.status]}<button class="btn sm ghost" data-adjundo="${a.id}" style="margin-left:6px">Undo</button>`}
      </div>`).join('')}` : ''}
    <div class="card" id="pbreak" style="margin:14px 0 0;background:rgba(255,255,255,.03)"></div>

    <button class="btn green block" id="psave">Save</button>`);
  const sh = document.getElementById('sheet'), $ = (q) => sh.querySelector(q);
  sh.querySelector('#sx').onclick = closeSheet;
  const read = () => ({
    set: { pay_type: $('#ptype').value, rate: Number($('#prate').value) || 0, commission_type: $('#ctype').value, commission_pct: Number($('#cpct').value) || 0 },
    wk: { sales: Number($('#wsales').value) || 0, commission_amt: Number($('#wcomm').value) || 0, other_amt: Number($('#wother').value) || 0, note: $('#wnote').value },
  });
  const draw = () => {
    const v = read(), c = payCalc(id, v), t = v.set.pay_type;
    $('#ratelbl').textContent = RATE_LABEL[t];
    $('#ratehint').textContent = t === 'salary' && v.set.rate ? `= ${money(v.set.rate * 52)} a year` : t === 'hourly' ? 'Overtime pays 1.5× after 40 hours.' : /^c_/.test(t) ? '1099: no overtime, no taxes withheld.' : '';
    $('#pctwrap').style.display = v.set.commission_type === 'percent' ? '' : 'none';
    $('#saleswrap').style.display = v.set.commission_type === 'percent' ? '' : 'none';
    $('#cflatwrap').style.display = v.set.commission_type === 'flat' ? '' : 'none';
    const line = (l, r) => `<div class="row" style="justify-content:space-between"><span class="small muted">${l}</span><span class="code">${r}</span></div>`;
    let lines = '';
    if (c.hAdj) lines += line(`Hours: ${c.cardH.toFixed(2)} on time cards ${c.hAdj > 0 ? '+' : '−'} ${Math.abs(c.hAdj).toFixed(2)} approved`, `${c.h.toFixed(2)} h`);
    if (t === 'hourly') {
      lines += line(`Regular ${c.reg.toFixed(2)} h × ${money(v.set.rate)}`, money(c.base));
      lines += line(`Overtime ${c.ot.toFixed(2)} h × ${money(cents(v.set.rate * 1.5))}`, money(c.otPay));
    } else if (t === 'c_hourly') lines += line(`${c.h.toFixed(2)} h × ${money(v.set.rate)}`, money(c.base));
    else lines += line(`${t === 'salary' ? 'Salary' : 'Flat amount'} (${c.h.toFixed(2)} h worked)`, money(c.base));
    if (v.set.commission_type === 'percent') lines += line(`Commission ${v.set.commission_pct}% of ${money(v.wk.sales)}`, money(c.comm));
    if (v.set.commission_type === 'flat') lines += line('Commission', money(c.comm));
    if (c.other) lines += line('Bonus / other', money(c.other));
    if (c.adjMoney) lines += line('Approved money changes', money(c.adjMoney));
    if (c.parts) lines += line('Parts personal (approved)', '−' + money(c.parts));
    if (c.reimb) lines += line('Parts reimbursement (approved)', '+' + money(c.reimb));
    if (c.pending) lines += `<div class="small" style="color:#ff7d33;margin-top:4px">${c.pending} pay change${c.pending === 1 ? '' : 's'} waiting. Not counted yet.</div>`;
    $('#pbreak').innerHTML = lines + `<div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 0"></div>` +
      `<div class="row" style="justify-content:space-between"><b>Gross pay</b><b style="font-size:20px">${money(c.gross)}</b></div>` +
      (c.open ? '<div class="small" style="color:#ff7d33;margin-top:6px">Still on the clock. Hours count up to right now.</div>' : '');
  };
  sh.querySelectorAll('select,input').forEach((el) => { el.oninput = draw; el.onchange = draw; });
  draw();
  const decide = (aid, st) => async () => {
    try {
      await adminCall('admin_decide_adjustment', { p_id: aid, p_status: st });
      const a = S.pay.adjustments.find((x) => x.id === aid); a.status = st; a.decided_by = st === 'pending' ? null : S.me.name;
      toast(st === 'approved' ? 'Approved ✓' : st === 'rejected' ? 'Rejected' : 'Back to waiting');
      renderAdmin(); openPayDetail(id);
    } catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
  sh.querySelectorAll('[data-adjok]').forEach((b) => b.onclick = decide(b.dataset.adjok, 'approved'));
  sh.querySelectorAll('[data-adjno]').forEach((b) => b.onclick = decide(b.dataset.adjno, 'rejected'));
  sh.querySelectorAll('[data-adjundo]').forEach((b) => b.onclick = decide(b.dataset.adjundo, 'pending'));
  $('#psave').onclick = async () => {
    const v = read(), b = $('#psave');
    if (v.set.rate < 0) return toast("Pay rate can't be negative.", true);

      await adminCall('admin_set_payroll_week', { p_employee: id, p_week_start: ws, p_sales: v.set.commission_type === 'percent' ? v.wk.sales : 0,
        p_commission_amt: v.set.commission_type === 'flat' ? v.wk.commission_amt : 0, p_other_amt: v.wk.other_amt, p_note: v.wk.note });
      closeSheet(); toast(`Saved ${e.name.split(' ')[0]}'s pay ✓`); loadAdmin(ws);
    } catch (err) { b.disabled = false; if (err.message !== '_silent') toast(err.message, true); }

}

function exportPayrollCSV() {
  const d = S.data, ws = S.ws, we = addDays(ws, 6), shop = shopName(S.shop);
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`, n2 = (n) => (Number(n) || 0).toFixed(2);
  const lines = [['Shop', 'Employee', 'Week Start', 'Week End', 'Pay Type', 'Rate', 'Total Hours', 'Regular Hours', 'Overtime Hours',
    'Base Pay', 'Overtime Pay', 'Commission Type', 'Commission %', 'Sales', 'Commission', 'Bonus/Other', 'Hours Adjustment', 'Parts Deduction', 'Reimbursement', 'Other Pay Changes', 'Gross Pay', 'Note', 'Pay Changes Waiting'].map(q).join(',')];
  let total = 0;
  for (const e of d.employees) {
    const c = payCalc(e.id); total += c.gross;
    lines.push([shop, e.name, ws, we, PAY_TYPES[c.set.pay_type], n2(c.set.rate), c.h.toFixed(2), c.reg.toFixed(2), c.ot.toFixed(2),
      n2(c.base), n2(c.otPay), { none: 'None', percent: '% of sales', flat: 'Flat $' }[c.set.commission_type],
      c.set.commission_type === 'percent' ? c.set.commission_pct : '', c.set.commission_type === 'percent' ? n2(c.wk.sales) : '',
      n2(c.comm), n2(c.other), n2(c.hAdj), n2(c.parts ? -c.parts : 0), n2(c.reimb), n2(c.adjMoney), n2(c.gross),
      [c.wk.note || ''].concat(c.adjs.filter((a) => a.status === 'approved').map((a) => `${ADJ_SHORT[a.kind]} ${adjAmt(a)}${a.note ? ' (' + a.note + ')' : ''}`)).filter(Boolean).join('; '),
      c.pending || ''].map(q).join(','));
  }
  lines.push(['', 'TOTAL', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', (Math.round(total * 100) / 100).toFixed(2), '', ''].map(q).join(','));
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `payroll_${(shop || 'shop').replace(/[^A-Za-z0-9]+/g, '-')}_${ws}_to_${we}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function openInvite(e) {
  if (!S.mailReady) {
    try { S.mailReady = !!(await adminCall('admin_mail_ready', {})); } catch (err) { if (err.message === '_silent') return; S.mailReady = false; }
  }
  const auto = S.mailReady;
  openSheet(`
    <div class="sheethead"><div><h2>Invite ${esc(e.name.split(' ')[0])}</h2><div class="small muted code">${esc([e.token ? shopName(e.shop_id) : '', e.office ? 'office login: ' + e.office : ''].filter(Boolean).join(' · '))}</div></div><button class="x" id="sx">✕</button></div>
    <label class="lbl">Email</label>
    <input id="iemail" class="field" type="email" value="${esc(e.email || '')}" placeholder="name@email.com" autocapitalize="off"><div style="height:14px"></div>
    ${auto
      ? `<button class="opt" id="iauto"><span class="ic">✉️</span><span class="grow"><b>Send invite email</b><span class="small muted">Goes out right away from the shop's email</span></span></button>`
      : `<a class="opt" id="igmail" href="#" target="_blank" rel="noopener"><span class="ic">📧</span><span class="grow"><b>Send with Gmail</b><span class="small muted">Opens Gmail with everything filled in. Then hit Send.</span></span></a>
         <a class="opt" id="imail" href="#"><span class="ic">✉️</span><span class="grow"><b>Send with my email app</b><span class="small muted">Outlook, Apple Mail, etc. Then hit Send.</span></span></a>`}
    <button class="opt" id="icopy"><span class="ic">🔗</span><span class="grow"><b>Copy link</b><span class="small muted">Paste it anywhere</span></span></button>`);
  const sh = document.getElementById('sheet');
  sh.querySelector('#sx').onclick = closeSheet;
  const iEm = sh.querySelector('#iemail');
  const validEmail = () => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(iEm.value.trim());
  const saveContact = async () => {
    const email = iEm.value.trim();
    if (e.token && e.id && email.toLowerCase() !== (e.email || '').toLowerCase()) {
      try {
        await adminCall('admin_update_employee', { p_id: e.id, p_name: e.name, p_active: e.active, p_shop: e.shop_id, p_phone: e.phone || '', p_email: email });
        e.email = email.toLowerCase();
      } catch (err) { if (err.message !== '_silent') toast(err.message, true); }
    }
  };
  const subject = e.token ? `Your ${shopName(e.shop_id) || C.SHOP_NAME} time clock link` : `Your ${C.SHOP_NAME} office login`;
  if (auto) {
    const btn = sh.querySelector('#iauto'), lbl = btn.querySelector('b');
    btn.onclick = async () => {
      if (!validEmail()) return toast('Type in a valid email first.', true);
      const to = iEm.value.trim();
      btn.disabled = true; lbl.textContent = 'Sending…';
      try {
        await saveContact();
        const id = await adminCall('admin_send_email', { p_to: to, p_subject: subject, p_body: inviteText(e) });
        let st = 'waiting';
        for (let i = 0; i < 12 && st === 'waiting'; i++) {
          await new Promise((r) => setTimeout(r, 1500));
          st = await adminCall('admin_email_status', { p_id: id });
        }
        if (st === 'failed') throw new Error("The email didn't go out. Try again, or use Copy link.");
        lbl.textContent = 'Sent ✓  (tap to send again)';
        toast(st === 'sent' ? `Invite emailed to ${to} ✓` : `Sending to ${to}… it should arrive in a minute.`);
      } catch (err) {
        lbl.textContent = 'Send invite email';
        if (err.message !== '_silent') toast(err.message, true);
      } finally { btn.disabled = false; }
    };
  } else {
    const mA = sh.querySelector('#imail'), gA = sh.querySelector('#igmail');
    const refresh = () => {
      const em = iEm.value.trim(), ok = validEmail();
      mA.href = ok ? `mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(inviteText(e))}` : '#';
      gA.href = ok ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(em)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(inviteText(e))}` : '#';
    };
    iEm.oninput = refresh; refresh();
    // Real links (not script-opened) so phones and computers always hand off to the email app.
    const sendClick = (a) => (ev) => {
      if (a.getAttribute('href') === '#') { ev.preventDefault(); return toast('Type in a valid email first.', true); }
      saveContact();
      setTimeout(() => toast('Nothing goes out until you hit Send in the email that opened.'), 600);
    };
    mA.onclick = sendClick(mA); gA.onclick = sendClick(gA);
  }
  sh.querySelector('#icopy').onclick = async () => {
    await saveContact();
    const link = e.token ? linkFor(e.token) : officeLink();
    try { await navigator.clipboard.writeText(link); toast('Link copied'); }
    catch (_) { prompt('Copy this link:', link); }
  };
}

  if (del) del.onclick = async () => {
    const mv = document.getElementById('lemove');
    const to = mv && mv.value ? S.logins.find((x) => x.id === mv.value) : null;
    const msg = `Delete the office login ${a.name} (${a.username})? This can't be undone.` +
      (clock ? (to ? `\n\nTheir time clock and hours will move to ${to.name} (${to.username}).` : `\n\nTheir time clock and hours stay on the Crew tab.`) : '');
    if (!confirm(msg)) return;
    try {
      await adminCall('admin_delete_login', { p_id: a.id, p_move_clock_to: to ? to.id : null });
      closeSheet(); toast('Login deleted ✓'); S.me = null; await loadAdmin();
    } catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
}

function wireSettings() {
  const run = async (fn, args, ok) => {
    try { await adminCall(fn, args); if (ok) toast(ok); S.shops = null; await loadAdmin(); }
    catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
  const find = (id) => S.logins.find((x) => x.id === id);
  document.getElementById('chpw').onclick = () => run('admin_change_my_password',
    { p_old: document.getElementById('pold').value, p_new: document.getElementById('pnew').value }, 'Password updated ✓');
  document.getElementById('copyoffice').onclick = async () => {
    try { await navigator.clipboard.writeText(officeLink()); toast('Link copied'); } catch (_) { prompt('Copy this link:', officeLink()); }
  };
  const addShop = document.getElementById('addshop');
  if (addShop) addShop.onclick = () => run('admin_add_shop', { p_name: document.getElementById('newshop').value }, 'Shop added ✓');
  app.querySelectorAll('[data-srename]').forEach((b) => b.onclick = () => {
    const x = S.shops.find((y) => y.id === b.dataset.srename);
    const n = prompt('Shop name', x.name);
    if (n && n.trim() && n.trim() !== x.name) run('admin_rename_shop', { p_id: x.id, p_name: n }, 'Renamed ✓');
  });
  const add = document.getElementById('addlogin');
  if (add) add.onclick = async () => {
    try {
      const r = await adminCall('admin_add_login', {
        p_name: document.getElementById('ln').value, p_username: document.getElementById('lu').value,
        p_password: document.getElementById('lp').value, p_is_owner: document.getElementById('lo').checked,
        p_phone: '', p_email: document.getElementById('lem').value,
        p_shop: document.getElementById('lsh').value, p_clock: document.getElementById('lc').checked });
      toast('Login added ✓'); S.shops = null; await loadAdmin();
      openInvite(Object.assign({ name: r.name, phone: r.phone, email: r.email }, r.employee || {}, { office: r.username }));
    } catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
  const loginInvite = (a) => openInvite(Object.assign({ name: a.name, phone: a.phone, email: a.email }, a.employee || {}, { office: a.username }));
  app.querySelectorAll('[data-linvite]').forEach((b) => b.onclick = () => loginInvite(find(b.dataset.linvite)));
  app.querySelectorAll('[data-lclock]').forEach((b) => b.onclick = async () => {
    const a = find(b.dataset.lclock);
    try { await adminCall('admin_add_clock', { p_id: a.id, p_shop: S.shop }); toast('Time clock added ✓'); await loadAdmin(); loginInvite(S.logins.find((x) => x.id === a.id)); }
    catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  });
  document.getElementById('myname').onclick = async () => {
    const n = prompt('Your name (shown on edits and at the top)', S.me.name);
    if (!n || !n.trim() || n.trim() === S.me.name) return;
    try { await adminCall('admin_update_my_name', { p_name: n }); S.me = null; toast('Name updated ✓'); await loadAdmin(); }
    catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
  const io = document.getElementById('installoffice');
  if (io) io.onclick = async () => { const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch (_) {} renderAdmin(); };
  const mysend = document.getElementById('mysend');
  if (mysend) mysend.onclick = () => openInvite(Object.assign({}, S.me.employee, { email: S.me.employee.email || S.me.email || '' }));
  const myclock = document.getElementById('myclock');
  if (myclock) myclock.onclick = async () => {
    try { await adminCall('admin_add_clock', { p_id: S.me.id, p_shop: S.shop }); S.me = null; toast('Time clock added ✓'); await loadAdmin(); }
    catch (err) { if (err.message !== '_silent') toast(err.message, true); }
  };
  const alertTo = document.getElementById('alertto');
  if (alertTo) {
    adminCall('admin_alert_email', {}).then((v) => { alertTo.value = v || ''; alertTo.placeholder = 'Email for the 8 PM list'; })
      .catch(() => { alertTo.placeholder = 'Email for the 8 PM list'; });
    document.getElementById('alertsave').onclick = async () => {
      try { await adminCall('admin_set_alert_email', { p_email: alertTo.value }); toast(alertTo.value.trim() ? 'Alert email saved ✓' : 'Alert emails turned off'); }
      catch (err) { if (err.message !== '_silent') toast(err.message, true); }
    };
  }
  app.querySelectorAll('[data-ledit]').forEach((b) => b.onclick = () => openLoginEdit(b.dataset.ledit));
  app.querySelectorAll('[data-lreset]').forEach((b) => b.onclick = () => {
    const a = find(b.dataset.lreset); const pw = prompt(`New password for ${a.name} (6+ characters):`);
    if (pw) run('admin_update_login', { p_id: a.id, p_active: a.active, p_is_owner: a.is_owner, p_new_password: pw }, 'Password reset ✓');
  });
  app.querySelectorAll('[data-lrole]').forEach((b) => b.onclick = () => {
    const a = find(b.dataset.lrole);
    if (confirm(a.is_owner ? `Make ${a.name} a manager? They won't be able to manage shops or logins.` : `Make ${a.name} an owner? They'll be able to manage shops and office logins.`))
      run('admin_update_login', { p_id: a.id, p_active: a.active, p_is_owner: !a.is_owner, p_new_password: null });
  });
  app.querySelectorAll('[data-lactive]').forEach((b) => b.onclick = () => {
    const a = find(b.dataset.lactive);
    if (!a.active || confirm(`Turn off ${a.name}'s login? They'll be signed out right away.`))
      run('admin_update_login', { p_id: a.id, p_active: !a.active, p_is_owner: a.is_owner, p_new_password: null });
  });
}

// ---------- keep fresh ----------
setInterval(() => {
  const el = document.getElementById('elapsed');
  if (el && S.data && S.data.open_punch) el.textContent = hm(minsOf(S.data.open_punch));
}, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || document.getElementById('sheet').classList.contains('open')) return;
  if (ADMIN) { if (S.adminTok && (S.data || S.crew.length)) loadAdmin(); }
  else if (S.token && S.data) loadEmp();
});

start();
</script>
